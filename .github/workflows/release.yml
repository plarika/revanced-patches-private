name: Private candidate build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  candidate:
    name: Build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate FantaMK maintenance state
        run: python .fantamk/check_maintenance.py
      - name: Build Android RVP
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: revanced-patches-private-candidate
          path: patches/build/libs/*.rvp
          if-no-files-found: error
          archive: false

# GitHub Releases remain a deliberate manual promotion step after
# ReVanced Manager validation. GPG/semantic-release is not run automatically.
