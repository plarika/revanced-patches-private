name: Open a PR to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-pr-main
  cancel-in-progress: true

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check whether a PR is needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "dev has no commits ahead of main; no PR required."
            exit 0
          fi

          count="$(gh pr list --base main --head dev --state open --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "An open dev -> main pull request already exists."
            exit 0
          fi

          if gh pr create --base main --head dev --draft \
            --title 'chore: merge dev to main' \
            --body 'Private maintenance promotion candidate.'; then
            echo "Draft pull request created."
          else
            echo "::warning::Automatic PR creation is disabled by repository settings."
            echo "Create the dev -> main PR manually when promotion is intended."
            exit 0
          fi
